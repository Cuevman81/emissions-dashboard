name: Daily Data Freshness Check

on:
  schedule:
    # Run daily at 11:00 UTC (6:00 AM Central Time)
    - cron: '0 11 * * *'
  workflow_dispatch:
    # Allow running manually from the GitHub Actions tab

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run data freshness check
        id: check
        env:
          EPA_CAMD_API_KEY: ${{ secrets.EPA_CAMD_API_KEY }}
        run: |
          # Exit codes: 0 = up to date, 10 = updates available, 1 = a check failed,
          # 11 = updates available and a check failed. Record it here; the last step
          # fails the run on 1, 11 or anything unexpected.
          set +e
          node scripts/check-updates.js
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Issue if updates are available
        if: steps.check.outputs.exit_code == '10' || steps.check.outputs.exit_code == '11'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if there is already an open issue for this update to prevent duplicate spam
          existing_issue=$(gh issue list --search "Data Update Available: Emissions Dashboard" --state open --json number --jq '.[0].number')
          if [ -z "$existing_issue" ]; then
            gh issue create --title "Data Update Available: Emissions Dashboard" --body-file update_details.txt
            echo "Created a new GitHub Issue for data update."
          else
            echo "An open update issue already exists (Issue #${existing_issue}). Skipping duplicate creation."
          fi

      - name: Fail the run if any check failed
        if: steps.check.outputs.exit_code != '0' && steps.check.outputs.exit_code != '10'
        env:
          EXIT_CODE: ${{ steps.check.outputs.exit_code }}
        run: |
          echo "::error::A data freshness check failed (exit code ${EXIT_CODE}). See the 'Run data freshness check' step log."
          exit 1
